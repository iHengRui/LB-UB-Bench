- key: beta_A
  latex: \beta_A
  aliases: []
  category: network_parameter
  definition_en: row-stochastic mixing factor of \(A\), \(\beta_A=\|A-\mathbf 1_N\pi_A^\top\|_{\pi_A}\in[0,1)\),
